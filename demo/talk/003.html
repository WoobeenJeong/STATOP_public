const META = {"pick_rows": ["sample_id", "age", "sex", "tumor_frac", "depth", "age_group"], "paired_rows": ["sample_id", "age", "sex", "tumor_frac", "depth"], "sum_rows": ["tumor_frac", "age", "depth", "sex"], "nopair_rows": ["tumor_frac", "depth", "sex", "age", "age_group"]};
const $ = (s) => document.querySelector(s);

/* TUI 와 같은 상태 — 고르는 중인가, 결과를 보는 중인가, 자세히를 폈는가 */
const ST = { mode: "pick", row: 0, detail: null, paired: false, ran: null };

const STORY = {
  pick: "A 에는 <b>age</b>, B 에는 <b>age_group</b> — 이름이 달라 짝이 없습니다. "
      + "이대로 [대조] 하면 어떻게 되는지 먼저 보세요.",
  nopair: "<b>age 가 통째로 빠졌습니다.</b> 각각 \"한쪽에만 있는 컬럼\"이 되어 대조에서 "
        + "제외됐습니다. 나이 축이 없으면 tumor_frac 의 변동이 무엇을 따라 움직이는지 "
        + "볼 수가 없습니다. → [컬럼 고르기] 로 돌아가 [짝 지정].",
  paired_pick: "age ↔ age_group 으로 이었습니다. 이름이 달라도 대조에 들어옵니다. → [대조]",
  summary: "컬럼마다 같음/다름이 한눈에 보입니다. ⛔ 줄을 골라 [자세히] 를 누르면 "
         + "그 컬럼만 겹쳐 봅니다.",
};
const DETAIL_STORY = {
  tumor_frac: "<b>미세한데 한쪽으로 쏠려 있습니다.</b> 값이 다른 행만 모아 보면 폭이 다릅니다. "
            + "나이를 축으로 놓고 봐야 원인이 보입니다 — 그래서 age 를 짝지어 둔 것입니다.",
  age: "<b>값은 다른데 순위는 맞습니다.</b> 10살 단위로 묶었을 뿐이라 순서가 보존됐습니다 — "
     + "깨졌지만 크게 깨지진 않았습니다.",
};

function cur() {
  if (ST.mode === "pick") return ST.paired ? S.paired_pick : S.pick;
  return ST.ran === "nopair" ? S.nopair : S.summary;
}
function detailOf() {
  const bag = ST.ran === "nopair" ? S.nopair_detail : S.summary_detail;
  return bag[String(ST.row)] || null;
}
function nRows() { return cur().lines.length; }
function move(d) { ST.row = Math.max(0, Math.min(nRows() - 1, ST.row + d)); draw(); }
function setRow(i) { ST.row = i; draw(); }
function openDetail() {
  if (ST.mode !== "result") return;
  if (!detailOf()) { say("이 컬럼은 대조하지 못했습니다 — 자세히 볼 것이 없습니다"); return; }
  ST.detail = ST.row; draw();
}
function backSummary() { ST.detail = null; draw(); }
function toPick() { ST.mode = "pick"; ST.row = 0; ST.detail = null; draw(); }
function pair() {
  const col = (ST.paired ? META.paired_rows : META.pick_rows)[ST.row];
  if (col !== "age") { say("짝 지을 상대가 없습니다 — age 줄에서 눌러 보십시오"); return; }
  ST.paired = true; ST.row = 1; say("짝 지음: age ↔ age_group"); draw();
}
function run() {
  ST.ran = ST.paired ? "summary" : "nopair";
  ST.mode = "result"; ST.row = 0; ST.detail = null;
  say("차이가 있습니다 — 아래를 보세요"); draw();
}
function say(t) { $("#say").textContent = t; }

const BTN = {
  pick: [["비교 파일 열기", null], ["키 바꾸기", null], ["행 식별자로 확정", null],
         ["짝 지정", pair], ["전체 선택/해제", null], ["◂ 이전", () => move(-1)],
         ["다음 ▸", () => move(1)], ["대조", run], ["◂ 뒤로", null]],
  result: [["◂ 이전", () => move(-1)], ["다음 ▸", () => move(1)],
           ["자세히", openDetail], ["요약으로", backSummary],
           ["컬럼 고르기", toPick], ["다시 대조", run], ["◂ 뒤로", null]],
};
const ACT = {};
function buttons() {
  const names = BTN[ST.mode === "pick" ? "pick" : "result"];
  return names.map(([n, fn], i) => {
    if (!fn) return `<button class="tbtn" disabled>${i + 1}.${n}</button>`;
    ACT[n] = fn;
    return `<button class="tbtn" onclick="ACT['${n}']()">${i + 1}.${n}</button>`;
  }).join("");
}

function draw() {
  const screen = ST.detail !== null ? detailOf() : cur().lines[ST.row];
  const hit = ST.detail !== null ? -1 : cur().rowLine[ST.row];
  // 커서가 선 줄만 과녁이 아니다 — **다른 줄을 누르면 그 줄로 커서가 간다** (TUI 와 같다)
  const targets = {};
  if (ST.detail === null) cur().rowLine.forEach((ln, i) => { targets[ln] = i; });
  $("#scr").innerHTML = screen.map((line, i) => {
    const to = targets[i];
    const cls = i === hit ? ' class="t-row t-here"' : (to !== undefined ? ' class="t-row"' : "");
    return to !== undefined
      ? `<div${cls} onclick="setRow(${to})">${line || "&nbsp;"}</div>`
      : `<div>${line || "&nbsp;"}</div>`;
  }).join("");
  $("#btns").innerHTML = buttons();
  const col = ST.mode === "result"
    ? (ST.ran === "nopair" ? META.nopair_rows : META.sum_rows)[ST.row] : null;
  $("#story").innerHTML = ST.detail !== null && DETAIL_STORY[col] ? DETAIL_STORY[col]
    : (ST.mode === "pick" ? (ST.paired ? STORY.paired_pick : STORY.pick)
       : (ST.ran === "nopair" ? STORY.nopair : STORY.summary));
}
document.addEventListener("keydown", (e) => {
  const k = { ArrowUp: () => move(-1), ArrowDown: () => move(1),
              Enter: openDetail, Escape: backSummary }[e.key];
  if (k) { e.preventDefault(); k(); }
});
say("비교할 파일을 하나 더 여세요");
draw();
