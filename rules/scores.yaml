# 자동 생성 파일 — schema/None 에서 생성됨. 수기 편집 금지 (statop rules build).
# rules_version: 1791c4674e57
grades:
- label: 안됨
  meaning: 수학적으로 정의되지 않거나(정의역 밖), 결과가 뜻을 잃음. 실행은 되지만 빨간 배너 + 원클릭 변환 제안
  color: 빨강
- label: 별로
  meaning: 계산은 되지만 가정이 어긋나 해석이 왜곡될 수 있음. 대안 병기 권고
  color: 노랑
- label: 문제없음
  meaning: 의도한 공간·분포에 맞음
  color: 초록
- label: 미지정
  meaning: 해당 조건이 아직 입력되지 않음. 적합하다는 뜻이 아니다 — 목록에는 보이되 판정하지 않고, 사용 시도 시 "이 조건은 아직 정의되지 않았습니다" 안내. 작성자가
    직접 검토해 채울 대상
  color: 회색
axes:
- axis: 공간
  values: ℝ (실수) / ℝ⁺ (양수) / [0,1] / 심플렉스(조성) / 카운트 / 순위·순서 / 이진 / 좌표(유클리드) / 확률분포 자체
- axis: 분포
  values: 정규 / 비정규·왜도 / 중꼬리(heavy-tail) / 이산 / 혼합
- axis: 구조
  values: i.i.d. / 군집·배치 / 반복 / 조성 의존
- axis: 척도
  values: 원척도 / log / 표준화 여부 (거리 계열은 표준화에 민감)
