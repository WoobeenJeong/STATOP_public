scores:
- id: SC-ERR-01
  family: ERR
  section: 1. 오차·적합도 (회귀·예측값 vs 관측값)
  name: MAE
  latex: $\mathrm{MAE}=\frac{1}{n}\sum_{i}\lvert y_i-\hat y_i\rvert$
  input: 두 연속 컬럼
  green: ℝ, 단위 동일
  yellow: 척도 상이한 여러 결과를 합산
  red: 순위·범주
  result_type: null
  note: outlier에 RMSE보다 강건
  unspecified: []
  coverage: full
  purpose: PG-01
  measures: 잔차 절댓값의 평균
  scale: y와 같은 단위. 0이 완벽, 상한 없음. 값 자체가 '평균적으로 이만큼 틀린다'
  shaken_by: 절댓값이라 큰 잔차가 제곱으로 증폭되지 않는다
- id: SC-ERR-02
  family: ERR
  section: 1. 오차·적합도 (회귀·예측값 vs 관측값)
  name: RMSE
  latex: $\sqrt{\frac1n\sum_i (y_i-\hat y_i)^2}$
  input: 두 연속
  green: ℝ, 정규 오차
  yellow: 중꼬리 오차(outlier 지배)
  red: 순위·범주
  result_type: null
  note: 큰 오차에 민감
  unspecified: []
  coverage: full
  purpose: PG-01
  measures: 잔차 제곱평균의 제곱근
  scale: y와 같은 단위. 항상 MAE 이상이고, 둘의 격차가 크면 큰 오차가 소수 존재
  shaken_by: 제곱 때문에 이상치 하나가 값을 끌어올린다
- id: SC-ERR-03
  family: ERR
  section: 1. 오차·적합도 (회귀·예측값 vs 관측값)
  name: MAPE
  latex: $\frac{100}{n}\sum_i\left\lvert\frac{y_i-\hat y_i}{y_i}\right\rvert$
  input: 두 연속
  green: ℝ⁺, y가 0에서 멀 때
  yellow: y가 작은 값 다수 (폭발)
  red: y에 0 포함
  result_type: null
  note: 0 근처 과대 → SC-ERR-04
  unspecified: []
  coverage: full
  purpose: PG-02
  measures: 잔차를 실제값으로 나눈 비의 평균 (%)
  scale: '% 단위. y가 0에 가까운 행에서 폭발하므로 상한이 사실상 없다'
  shaken_by: y가 작은 행 하나가 전체 값을 지배한다
- id: SC-ERR-04
  family: ERR
  section: 1. 오차·적합도 (회귀·예측값 vs 관측값)
  name: sMAPE
  latex: $\frac{100}{n}\sum_i\frac{\lvert y_i-\hat y_i\rvert}{(\lvert y_i\rvert+\lvert\hat y_i\rvert)/2}$
  input: 두 연속
  green: ℝ⁺
  yellow: 부호 혼합
  red: 둘 다 0인 행
  result_type: null
  note: null
  unspecified: []
  coverage: full
  purpose: PG-02
  measures: 잔차를 두 값의 평균으로 나눈 비 (%)
  scale: 0~200%. MAPE의 폭발을 억제하지만 둘 다 0인 행은 정의되지 않는다
  shaken_by: 분모가 대칭이라 MAPE보다 안정하나 여전히 0 근처에 민감
- id: SC-ERR-05
  family: ERR
  section: 1. 오차·적합도 (회귀·예측값 vs 관측값)
  name: MSLE / RMSLE
  latex: $\frac1n\sum_i\left(\log(1+y_i)-\log(1+\hat y_i)\right)^2$
  input: 두 연속
  green: 카운트·ℝ⁺, 지수 성장
  yellow: 음수 없음 확인
  red: 음수
  result_type: null
  note: 비율 오차 관점
  unspecified: []
  coverage: full
  purpose: PG-02
  measures: log(1+y) 척도에서의 제곱 오차
  scale: log 단위. 비율 오차 관점이라 큰 값의 오차에 관대하다
  shaken_by: 음수를 못 받고, +1 이 작은 값의 상대 오차를 눌러 버린다
- id: SC-ERR-06
  family: ERR
  section: 1. 오차·적합도 (회귀·예측값 vs 관측값)
  name: R²
  latex: $1-\frac{\sum(y_i-\hat y_i)^2}{\sum(y_i-\bar y)^2}$
  input: 두 연속
  green: 선형 회귀
  yellow: 비선형·범위 제한
  red: 분류
  result_type: null
  note: 검증셋에서 음수 가능
  unspecified: []
  coverage: full
  purpose: PG-03
  measures: 총 변동 중 모델이 설명한 몫
  scale: 1이 완벽, 0이 평균 예측과 같음. 검증셋에서는 음수도 나온다
  shaken_by: y의 분산이 작으면 잘 맞아도 낮게 나온다 — 자료에 따라 값이 흔들린다
- id: SC-ERR-07
  family: ERR
  section: 1. 오차·적합도 (회귀·예측값 vs 관측값)
  name: Lin's CCC
  latex: $\rho_c=\frac{2\sigma_{xy}}{\sigma_x^2+\sigma_y^2+(\mu_x-\mu_y)^2}$
  input: 두 연속
  green: 방법 비교, 동일 단위
  yellow: 범위 제한
  red: 단위 상이
  result_type: null
  note: 정확도+정밀도
  unspecified: []
  coverage: full
  purpose: PG-03
  measures: 일치선(y=x)으로부터의 벗어남 — 정밀도와 정확도를 함께
  scale: −1~1. 1이 완전 일치. 상관이 높아도 치우침이 있으면 낮아진다
  shaken_by: 두 측정의 범위가 좁으면(범위 제한) 낮게 나온다
- id: SC-ERR-08
  family: ERR
  section: 1. 오차·적합도 (회귀·예측값 vs 관측값)
  name: Bias (평균 차이)
  latex: $\frac1n\sum_i(\hat y_i-y_i)$
  input: 두 연속
  green: 두 측정/예측의 계통 치우침을 원 단위로 요약(Bland–Altman 중심선)
  yellow: 비례 편향(크기에 따라 오차가 변함)이 존재
  red: 산포를 무시하고 편향만으로 일치도 판정(LoA 미동반)
  result_type: null
  note: Bland–Altman 중심선
  unspecified: []
  coverage: full
  purpose: PG-01
  measures: 잔차의 부호 있는 평균
  scale: y와 같은 단위. 0이 치우침 없음. 부호가 과대예측/과소예측 방향
  shaken_by: 상쇄되어 크기는 못 말하지만 방향 자체는 안정적이다
  recommend: 평균차 ± 1.96 SD(일치한계)와 함께 보고하고 비례 편향 점검
  source: Statistical methods for assessing agreement between two methods of clinical measurement (Bland
    & Altman 1986)
- id: SC-ERR-09
  family: ERR
  section: 1. 오차·적합도 (회귀·예측값 vs 관측값)
  name: Huber loss
  latex: $L_\delta(r)=\begin{cases}\tfrac12 r^2 & \lvert r\rvert\le\delta\\ \delta(\lvert r\rvert-\tfrac12\delta)
    & \text{else}\end{cases}$
  input: 두 연속, δ
  green: 중꼬리·이상치 섞인 회귀 잔차에 강건 손실이 필요(δ 명시)
  yellow: δ 미기록 → 재현·비교 불가
  red: δ 없이 보고하거나 이상치 없는데 관성적으로 사용
  result_type: null
  note: δ 기록 필수
  unspecified: []
  coverage: full
  purpose: PG-01
  measures: δ 안쪽은 제곱, 바깥은 절댓값으로 잰 잔차
  scale: y와 같은 단위. δ를 키우면 RMSE에, 줄이면 MAE에 가까워진다
  shaken_by: δ 선택에 값이 달라지므로 δ를 기록해야 비교된다
  recommend: 전이점 δ를 반드시 기록하고 잔차 스케일(MAD 등)에 맞춰 선택
  source: Robust estimation of a location parameter (Huber 1964)
- id: SC-ERR-10
  family: ERR
  section: 1. 오차·적합도 (회귀·예측값 vs 관측값)
  name: Brier score
  latex: $\frac1n\sum_i(p_i-o_i)^2$
  input: 확률 컬럼 + 이진 라벨
  green: '[0,1] 확률'
  yellow: 점수가 확률이 아님(미보정)
  red: 라벨 비이진
  result_type: null
  note: 보정+판별 종합
  unspecified: []
  coverage: full
  purpose: PG-04
  measures: 예측 확률과 실제 결과(0/1)의 제곱 오차
  scale: 0~1. 0이 완벽. 보정과 판별을 한 값에 섞어 담는다
  shaken_by: 경계가 있고 한 행이 값을 지배하지 못한다
- id: SC-ERR-11
  family: ERR
  section: 1. 오차·적합도 (회귀·예측값 vs 관측값)
  name: Log loss
  latex: $-\frac1n\sum_i\left[o_i\log p_i+(1-o_i)\log(1-p_i)\right]$
  input: 확률 + 이진
  green: (0,1)
  yellow: p에 0/1 → eps 필요
  red: 비확률 점수
  result_type: null
  note: eps 규칙 F-01
  unspecified: []
  coverage: full
  purpose: PG-04
  measures: 실제 결과에 준 확률의 음의 로그
  scale: 0 이상, 상한 없음. 확실하게 틀린 예측 하나가 값을 크게 올린다
  shaken_by: p가 0/1에 닿으면 발산해 eps가 필요하다 (F-01)
- id: SC-CLS-01
  family: CLS
  section: 2. 분류·진단 성능
  name: Sensitivity (재현율)
  latex: $\frac{TP}{TP+FN}$
  input: 이진 예측 + 라벨
  green: 임계값이 명시된 이진 판정에서 양성 검출력 평가
  yellow: 임계값 미기록 → 값이 임계값에 종속
  red: 임계값·특이도 없이 단독 보고
  result_type: null
  note: 임계값 기록
