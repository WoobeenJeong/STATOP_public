# 자동 생성 파일 — schema/registry-guardrails.md 에서 생성됨. 수기 편집 금지 (statop rules build).
# rules_version: 1791c4674e57
execution_order:
- GR-03
- GR-02
- GR-04
- GR-01
guardrails:
- id: GR-03
  name: data_loss_join
  order: 1
  checks:
  - check: Join/match rate
    definition: 조인 후 매칭된 행 / 조인 전 좌측(또는 기준) 행
    tier_raw: 낮으면 Diagnostic, 매우 낮으면 Gate
    tier: gate
  - check: Row retention
    definition: 각 처리 단계 후 남은 행 / 이전 단계
    tier_raw: 단계별 표(퍼널)
    tier: diagnostic
  - check: 손실의 편향
    definition: 손실된 행이 라벨·그룹·메타와 연관되는지(카이제곱/SMD)
    tier_raw: 연관되면 Gate (무작위 손실이 아님)
    tier: gate
  - check: 중복 폭증
    definition: 조인 후 행 수가 기준보다 늘면(다대다 조인 실수)
    tier_raw: Gate
    tier: gate
  - check: 키 무결성
    definition: 조인 키 결측·타입 불일치·중복 키
    tier_raw: Diagnostic
    tier: diagnostic
  - check: 군별 손실률
    definition: 그룹·메타 컬럼 값별 손실률과 전체 대비 편차
    tier_raw: Diagnostic (GR-02 원인 추적 입력)
    tier: diagnostic
  override_floor: gate
- id: GR-02
  name: srm
  order: 2
  tier: gate
  check: χ² on 그룹 카운트 vs 기대 비율
  expected_ratio: 사용자 입력(기본 1:1)
  threshold: p < 0.0005
  dimensional: 메타 컬럼별, Bonferroni
  override_floor: diagnostic
  cause_trace: GR-03 군별 손실률·GR-04 불균형과 연결해 원인 후보 제시 (인과 단정 금지)
  counterfactual: 해당 군 손실을 제외한 예상 비율을 재계산해 SRM 해소 여부 병기
  unexplained_branch: 손실로 설명되지 않으면 "기대 비율 설정 오류 또는 모집단 불균형 확인 필요"
- id: GR-04
  name: metric_observation_imbalance
  order: 3
  checks:
  - check: 그룹별 n 편차
    definition: max n / min n 비, 또는 최소 그룹 n
    tier_raw: 최소 n < 임계(기본 10) Diagnostic, < 5 강한 경고
    tier: diagnostic
  - check: 지표 커버리지
    definition: 지표가 정의된(비결측) 행 / 전체
    tier_raw: 낮으면 "부분 지표" 경고
    tier: diagnostic
  - check: 가중 필요
    definition: 세그먼트 합산 시 그룹 크기 무시
    tier_raw: Simpson 위험(S-R11) → P(Y), P(Y\|Z) 병기 권고
    tier: diagnostic
  - check: 균형처럼 보이는 불균형
    definition: 라벨은 50:50인데 메타(기관·age·immune)가 편중
    tier_raw: 'SC-BE-09(SMD)로 검출 → 규칙 #6'
    tier: diagnostic
  - check: 지표 안정성
    definition: 소표본 그룹의 지표 부트스트랩 CI 폭
    tier_raw: 넓으면 Diagnostic (P-231)
    tier: diagnostic
  override_floor: diagnostic
- id: GR-01
  name: out_of_range
  order: 4
  grades:
  - situation: 수학적으로 불가능한 값
    tier: gate
    example: 확률 1.3, 음수 카운트, fraction 1.2, |r|>1
  - situation: 정의역 경계 특수값
    tier: diagnostic
    example: 확률 정확히 0/1(log 불가), 상관 정확히 ±1(완전분리 의심)
  - situation: 통계적으로 이례적(분포 꼬리 밖)
    tier: diagnostic
    example: '값이 기대분포 99.9% 밖 (E-6: skew/scale 체크)'
  - situation: 물리적으로 비현실적(도메인)
    tier: diagnostic
    example: 나이 −5, 발현량 음수, VAF>1
  actions:
  - action: flag
    desc: 범위 밖 셀을 표시(음영)하고 개수 보고. 기본
    auto: true
  - action: drop
    desc: 범위 밖 행 제거 (결측 정책과 동일 로그)
    auto: true
  - action: clip
    desc: '경계로 자르기. 경고: 분포 왜곡. 사용자 명시적 선택만, 로그 필수'
    auto: false
  - action: keep
    desc: 그대로 두되 배너 유지 (Diagnostic만)
    auto: true
  default_action: flag
  override_floor: diagnostic
