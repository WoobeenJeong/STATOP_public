  combination: 미확정 의미 타입 포함
  verdict: yellow
  verdict_raw: 노랑
  why: 타입 미확정. 판정 보류
  fix: 확정 드롭다운 포커스
  sources: 내부 절차 — (선택 → 타입 확정 → 판정)
