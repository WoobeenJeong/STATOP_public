# 자동 생성 파일 — schema/registry-tests.md 에서 생성됨. 수기 편집 금지 (statop rules build).
# rules_version: 72d1381d2131
- id: S-R01
  combination: fraction × fraction, 상관 (같은 조성 세트)
  verdict: red
  verdict_raw: 빨강
  why: 조성 성분은 합이 고정되어 한쪽이 커지면 다른 쪽이 작아짐. 상관에 음의 편향(spurious correlation) 발생
  fix: 세트 CLR 생성(F-11) → 지정 교체. 2성분이면 ALR(F-12)
  sources: Pearson 1897, Aitchison, Gloor 2017
- id: S-R02
  combination: fraction × fraction, 차이/평균 비교 (군 간)
  verdict: red
  verdict_raw: 빨강
  why: 원척도 비율의 차이는 척도 의존적·비대칭(0.01→0.02와 0.50→0.51이 동일 취급)
  fix: CLR 또는 logit 변환
  sources: Gloor 2017
- id: S-R03
  combination: count × count, 상관/비교, 총합(depth) 상이
  verdict: red
  verdict_raw: 빨강
  why: 총합 차이가 값을 지배함. 깊이 정규화 없으면 총합을 비교하는 것
  fix: 비율화 후 S-R01 경로, 또는 NB 모형(T-803)
  sources: Whalen 2022 P3
- id: S-R04
  combination: count 단독, log 변환 요청
  verdict: yellow
  verdict_raw: 노랑
  why: 0이 있으면 log 불가. eps 를 일반 법칙처럼 제시하지 않는다 — 더하는 값에 따라 결과가 달라지고, 검출 한계 아래 값이 상수로 눌린다
  fix: 0에서 매끄럽게 정의되는 변환을 먼저 본다 (VST·arcsinh). eps 를 쓴다면 그 값을 기록하고 결과가 그 선택에 얼마나 민감한지 함께 본다
  sources: '내부 정의 — log(0) 미정의 · Feng et al. 2014, Log-transformation and its implications for data analysis
    (검출 한계 문제) · 내부 사례 #2'
- id: S-R05
  combination: probability, "변동이 크다" 질문
  verdict: yellow
  verdict_raw: 노랑 → Diagnostic
  why: SD는 0.5 부근과 0/1 부근을 동일 취급. CV는 0 근처 과대
  fix: SD + p(1−p) 정규화 + 2σ 병기(P-233)
  sources: '내부 #3'
- id: S-R06
  combination: log-scale × 원척도, 차이/상관
  verdict: red
  verdict_raw: 빨강
  why: log 척도에서의 차이는 원척도의 절대차가 아니라 비율 변화에 대응한다. log 값과 원척도 값을 섞어 차이·상관을 구하면 동일한 척도에서의 비교가 아니다
  fix: 한쪽 변환 통일
  sources: '내부 사례 #2 (11절 매핑) · Feng et al. 2014'
- id: S-R07
  combination: percent × fraction
  verdict: red
  verdict_raw: 빨강
  why: 100배 척도 불일치
  fix: /100 통일
  sources: 내부 정의 — 단위 환산
- id: S-R08
  combination: ordinal code, 평균/ t-test
  verdict: yellow
  verdict_raw: 노랑
  why: 코드 간 간격이 등간이라는 근거 없음. 연속형으로 다루려면 동일 간격 가정을 먼저 확인해야 한다
  fix: 동일 간격 가정을 확인하도록 유도. 미충족이면 순위 기반·ordinal 지표를 우선 검토(T-103/123, ordinal 회귀 T-804, 분류로 처리 등)
  sources: Stevens 1946 척도론 · Velleman & Wilkinson 1993 (기계적 적용에 대한 반론)
- id: S-R09
  combination: nominal code, 상관/회귀 연속 처리
  verdict: gate
  verdict_raw: 회색
  why: nominal 은 범주 식별을 위한 코드에 불과하고 순서 의미가 없다. 회귀 계수·상관계수를 그 값으로 해석하지 않는다
  fix: indicator·dummy 로 변환해 사용
  sources: 내부 정의 — 범주 식별 코드 · Stevens 1946
- id: S-R10
  combination: id 컬럼이 분석 변수로 지정
  verdict: gate
  verdict_raw: 회색
  why: ID 는 관측값의 크기·순서와 무관하며 단순히 관측치를 구분하기 위한 변수다
  fix: hold 전환
  sources: 내부 정의 — 식별자
- id: S-R11
  combination: 집계값(합·평균) vs 원자료, 층화 변수 존재
  verdict: yellow
  verdict_raw: 노랑
  why: 합산이 층화 변수(size 등)를 지워 Simpson 역전 가능
  fix: P(Y)와 P(Y|Z) 병기(T-1006)
  sources: 'Pearl 2014, 내부 #5'
- id: S-R12
  combination: z-score × z-score, 기준 집단 상이
  verdict: yellow
  verdict_raw: 노랑
  why: z-score 는 기준 집단의 평균·표준편차로 산출된다. 서로 다른 기준으로 표준화된 값을 견주면 두 분포 자체의 차이가 섞인다 — 다만 그렇게 볼 의도가 있을 수 있으므로
    막지 않는다
  fix: 두 분포에 차이가 없는지 함께 제시하고, 동일 기준 표준점수로 다시 본다. 그 비교는 간접 비교 수준이라 직접 비교보다 떨어지고 부정확할 수 있음을 고지
  sources: 내부 정의 — z 는 기준 집단 g 에 의존
- id: S-R13
  combination: datetime 파생 피처 × 라벨, 시간 순서 무시
  verdict: red
  verdict_raw: 빨강
  why: 미래 정보 혼입(L2.1)
  fix: 시간 split 제안 (모델 목록)
  sources: Kapoor 2023 L2.1
