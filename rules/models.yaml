triads:
- question: MB-Q01 이진
  goal: AUC
  support: Sens·Spec@임계
  guardrail: PR-AUC + 기저율 (불균형 시 MB-C16)
- question: MB-Q01 불균형 이진
  goal: PR-AUC
  support: Recall·Precision
  guardrail: MCC / balanced acc
- question: MB-Q02/03 다중
  goal: macro-F1(명시)
  support: 클래스별 recall 표
  guardrail: 소수클래스 성능·혼동행렬 (MB-C18)
- question: MB-Q08 임베딩
  goal: iLISI/kBET
  support: 이웃 배치비율
  guardrail: cLISI/label silhouette (MR-G05)
preprocessing:
- family: distance
  examples: kNN, SVM(RBF/선형), k-means
  scaling: required
  why: 거리·커널이 척도에 직접 의존
- family: penalized
  examples: 로지스틱/선형 회귀 + L1·L2(ridge/lasso/elastic)
  scaling: required
  why: 벌점이 계수 크기에 걸려 척도 큰 변수가 덜 벌점받음
- family: linear
  examples: 로지스틱/선형 회귀 (정규화 없음)
  scaling: optional
  why: 계수가 척도를 흡수 — 값은 같고 해석 단위만 달라짐
- family: neural
  examples: MLP, CNN, RNN, Transformer
  scaling: depends
  why: 입력 스케일이 고르지 않으면 수렴이 늦어질 수 있다. 다만 내부 구조·옵티마이저·입력 형태(tabular 여부 등)에 따라 달라 일률적으로 말할 수 없다
- family: projection
  examples: PCA, LDA, UMAP, t-SNE
  scaling: depends
  why: 척도가 큰 변수가 축에 더 큰 영향을 줄 수 있다. 다만 원척도 그대로 보는 것이 목적일 때도 있어 목적에 따라 갈린다
- family: tree
  examples: decision tree, RF, GBM, XGBoost, LightGBM
  scaling: optional
  why: 분할이 값의 순서만 보므로 단조 변환에 불변
- family: naive_bayes
  examples: GaussianNB, MultinomialNB
  scaling: optional
  why: 변수마다 따로 적합하므로 서로의 척도가 영향을 주지 않음
comparison:
- condition: same_n_nested
  comparable: 가능
  allowed:
  - 우도비검정(LRT)
  - AIC
  - BIC
  why: 한 모델의 항이 다른 모델 항의 부분집합이고 자료가 같다
- condition: same_n_non_nested
  comparable: 부분
  allowed:
  - AIC
  - BIC
  why: 포함관계가 아니라 LRT 의 귀무분포가 성립하지 않는다
- condition: different_n
  comparable: 주의
  allowed:
  - 공통 행으로 다시 적합해 비교
  why: 결측 처리로 행 수가 달라 같은 자료를 본 것이 아니다
- condition: different_outcome
  comparable: 불가
  allowed: []
  why: 결과변수가 다르면 우도의 단위가 달라 값을 견줄 수 없다
- condition: different_family
  comparable: 부분
  allowed:
  - 예측성능(교차검증)
  why: 분포족이 다르면 우도·AIC 를 직접 견줄 수 없다
