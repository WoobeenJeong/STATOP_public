# rules_version: 1791c4674e57
categories:
- code: G
  name: 값이 사는 공간
  checks: 실수선 ℝ / 양의 실수 ℝ⁺ / 구간 [0,1] / 심플렉스(조성) / 순위 / 카운트 ℕ / 시간축 / 로그 공간
  source: S-T 의미 타입, C-12, C-14
- code: D
  name: 가정하는 분포족
  checks: 정규 / 정규 근사(CLT) / 분포 무관 / 형태 유사 / Poisson·NB / 이항 / 베타 / 비례위험
  source: C-01, C-04, C-10, C-11
- code: I
  name: 관측 간 관계
  checks: 독립 / 대응(짝) / 반복측정 / 군집(환자·batch) / 시계열 자기상관 / 조성 내 성분 간 의존
  source: C-05, M0-7, S-T13
- code: S
  name: 값의 척도
  checks: 원척도 / log / logit / z / 순위 / 비율 vs 차이 / 등간 여부
  source: S-T, S-R
- code: N
  name: 크기와 희소성
  checks: 군별 n / 셀 기대빈도 / EPV / 동점 비율 / 0 비율
  source: C-09, C-10
- code: M
  name: 결측 처리
  checks: 허용 방식(listwise/pairwise/불허) / 결측 비무작위 / 0과 NaN 구분
  source: C-13, 1절
- code: H
  name: 검정이 답하는 질문
  checks: 위치 vs 형태 / 차이 vs 비율 / omnibus vs 대비 / 단측·양측
  source: A1, R-01
- code: P
  name: 검정 수
  checks: 명시적 다중검정 / 암묵적(사후 선택, 컬럼 스캔) / 세션 내 교체
  source: C-15, R-16
- code: E
  name: 결과 읽기
  checks: 효과크기 부재 / p 오해 / CI 부재 / 방향 착오
  source: P-20x, P-23x
- code: C
  name: 구현 문제
  checks: 동점 보정 / 연속성 보정 / 0·inf / 수렴 실패 / seed
  source: 구현 검사
nan_policies:
- code: LW
  method: Listwise
  meaning: 분석에 쓰이는 컬럼 중 하나라도 NaN인 행 제거
  applies_to: 회귀(T-8xx), 다변량, 이원 ANOVA(T-401)
- code: GW
  method: Groupwise
  meaning: 그 군의 값만 없으면 그 관측만 제거, 군별 n 달라도 됨
  applies_to: 독립 2군·k군 검정(T-101~105, 121~124, 201~203)
- code: PW
  method: Pairwise
  meaning: 두 변수 모두 있는 행만 사용(상관행렬은 쌍마다 n 다름)
  applies_to: 상관(T-301~305). 행렬 전체 비교 시 n 불일치 경고
- code: PR
  method: Pair-required
  meaning: 짝 중 하나라도 없으면 그 짝 제거
  applies_to: 대응 검정(T-111~113, 211), Bland–Altman(T-602)
- code: CW
  method: Complete-within-subject
  meaning: 피험자의 모든 조건이 있어야 함. 하나라도 없으면 피험자 전체 제거
  applies_to: RM ANOVA(T-131), Friedman(T-132), Cochran Q(T-212)
- code: ML
  method: Model-based (허용)
  meaning: MAR 가정 하에 결측 그대로 적합 (제거 불필요)
  applies_to: 혼합모형(T-133, 404), Cox(T-807, 검열은 결측 아님)
- code: 'NO'
  method: 불허
  meaning: 셀/성분에 NaN이 있으면 계산 불가
  applies_to: '분할표(T-201~203, 211, 212: 범주 결측은 행 제거로 귀결), 조성 세트(T-1001~1006: 성분 NaN은 행 제거 또는 세트 재정의)'
