*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--font-sans)}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 36px}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:20px;font-weight:700;
       letter-spacing:-.035em}
.brand-v{color:var(--ok)}
.frame{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:12px}
.bar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px 12px;
     border-bottom:1px solid var(--border);background:var(--bg-subtle)}
.bar+.bar{background:var(--bg)}
.lab{font-size:11.5px;color:var(--text-faint);letter-spacing:.04em;margin-right:5px}
button{font:12px var(--font-sans);padding:3px 10px;border-radius:13px;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--bg);color:var(--text)}
button[aria-pressed="true"]{background:var(--neutral);color:var(--bg);
  border-color:var(--neutral)}
button[disabled]{opacity:.3;cursor:default;color:var(--text-faint)}
button.r[aria-pressed="false"],
button.p[aria-pressed="false"]{opacity:.35;text-decoration:line-through}
button.p{font-family:var(--font-mono);letter-spacing:.04em}
button.lk{font-family:var(--font-mono);font-size:11.5px}
button.cl{font-size:11.5px;max-width:15em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.g{min-width:72px}
button.pg{padding:3px 7px;border-radius:4px;min-width:24px}
button.pg.wide{min-width:62px;margin-left:4px}
button.pg[disabled]{opacity:.25}
.pgn{font:11px var(--font-mono);color:var(--text-muted);padding:0 2px;align-self:center}
.bar.col{align-items:flex-start}
.pcol{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
#ps{display:flex;flex-wrap:wrap;gap:4px;align-items:center;
  padding:6px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
#pact{display:flex;gap:4px}
.picker{max-width:330px;border:1px solid var(--border);

input.find{display:block;width:100%;box-sizing:border-box;font:11.5px var(--font-sans);

input.find::placeholder{color:var(--text-faint);opacity:1}
input.find:focus{outline:none;background:var(--bg)}
.plist{max-height:84px;overflow-y:auto}   /* 약 4칸 */
#ps{max-height:74px;overflow-y:auto}      /* 칩이 많아도 두 줄까지만 */
button.prow{display:flex;gap:6px;width:100%;border:0;border-radius:0;padding:3px 8px;
  background:var(--bg);text-align:left;font:11.5px var(--font-sans);align-items:baseline}
button.prow[aria-pressed="true"]{background:var(--bg);color:var(--text)}
button.prow:hover{background:var(--neutral-bg)}
button.prow[aria-pressed="false"]{opacity:.42}

.pnone{padding:5px 9px;font-size:11px;color:var(--text-faint)}

button.reset{border-radius:4px;margin-left:auto}
.body{display:flex}

.list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;max-width:100%}
.list button{font-size:11.5px;padding:2px 8px;border-radius:10px;

.list button:hover{border-color:var(--text);background:var(--neutral-bg)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;

.badge.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.badge.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn-text)}
.badge.danger{background:var(--danger-bg);border-color:var(--danger);

.badge.none{background:var(--neutral-bg);border-color:var(--none);

.foot{padding:7px 12px;border-top:1px solid var(--border);font-size:11.5px;

function fitAll(){

  // 들어오게 하는 것은 사람 손이 아니라 이 함수의 일이다
  const ns=G.nodes.filter(vis);
  if(!ns.length) return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of ns){ const r=rad(n)+14;
    x0=Math.min(x0,n.x-r); y0=Math.min(y0,n.y-r);
    x1=Math.max(x1,n.x+r); y1=Math.max(y1,n.y+r); }
  const k=Math.max(.08, Math.min(2, Math.min(W/(x1-x0||1), H/(y1-y0||1))*0.92));
  view.k=k;
  view.x=W/2-(x0+x1)/2*k; view.y=H/2-(y0+y1)/2*k;
}

const inProj=n=>!n.projs || !n.projs.length || n.projs.some(p=>!pOff.has(p));
const inCloud=n=>!n.clouds || !n.clouds.length || n.clouds.some(c=>!cOff.has(c));
const vis=n=>inProj(n) && inCloud(n) && !(n.kind==='metric' && off.has(n.role))
            && !(n.kind==='column' && !linkOn.has('concept'));
const claimNos=()=>{ const c=G.claims.find(x=>x.key===claimSel);
  return c? new Set(c.sessions) : null; };
const edgeOn=e=>{
  if(e.kind==='hyp')   return linkOn.has('data');
  if(e.kind==='claim') return linkOn.has('claim');
  if(e.kind==='holds') return linkOn.has('concept');   // 축(개념) 층
  return true; };                                      // owns 는 묶음 구조라 늘 둔다
const dimEdge=e=>{ const cn=claimNos();
  if(cn) return !cn.has(e.no);
  return qSel && e.q!==qSel; };
const dimNode=n=>{ const cn=claimNos();
  if(cn) return !G.edges.some(e=>cn.has(e.no)&&(e.s===n.id||e.t===n.id));
  return qSel && !G.edges.some(e=>e.q===qSel&&(e.s===n.id||e.t===n.id)); };

function size(){

  const box=cv.parentElement.getBoundingClientRect();
  const h=Math.max(320, Math.round(box.height));
  const r=cv.getBoundingClientRect();

size();
// 프로젝트를 둥글게 깔고, 나머지는 **자기 첫 프로젝트 옆**에서 출발한다 —
// 옵시디언의 방울은 물리 이전에 "어디서 태어나느냐"가 절반이다
const projAngle={}; let pi=0;
const pn=G.nodes.filter(n=>n.kind==='project').length;
G.nodes.forEach(n=>{ if(n.kind==='project'){
  const a=(pi++)/Math.max(pn,1)*6.283; projAngle[n.projs[0]]=a;
  n.x=W/2+185*Math.cos(a); n.y=H/2+150*Math.sin(a); n.vx=0; n.vy=0; }});
let si=0;
G.nodes.forEach(n=>{ if(n.kind==='project') return;
  const a=(n.projs&&n.projs.length? projAngle[n.projs[0]] : 0)
          + (si*2.399)%1.2 - 0.6;                 // 황금각으로 흩뿌림
  const r=235+((si*53)%70); si++;
  n.x=W/2+r*Math.cos(a); n.y=H/2+r*0.82*Math.sin(a); n.vx=0; n.vy=0; });

function step(){
  cool=Math.max(.02, cool*0.994);   // 끝까지 식혀 제자리에 선다
  const live=G.nodes.filter(vis);
  for(const n of live){ n.vx*=0.90; n.vy*=0.90; }
  for(let i=0;i<live.length;i++) for(let j=i+1;j<live.length;j++){
    const a=live[i], b=live[j];
    let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy||1;
    if(d2>120000) continue;
    // 허브(degree 큰 노드)가 더 세게 밀어 자기 주변 공간을 만든다
    const ma=1+Math.sqrt(degree[a.id]||0)*.35, mb=1+Math.sqrt(degree[b.id]||0)*.35;
    const d=Math.sqrt(d2), f=1050*ma*mb/d2;
    a.vx-=f*dx/d; a.vy-=f*dy/d; b.vx+=f*dx/d; b.vy+=f*dy/d;
  }
  // 간선 종류마다 용수철이 다르다 — 묶음 안(owns·derives)은 짧고 세게,
  // 묶음 사이(claim)는 길고 약하게. 이 비대칭이 방울과 그 사이 목을 만든다
  const SPR={owns:[100,.009], holds:[110,.007], derives:[80,.009],
             hyp:[128,.007], claim:[280,.0016]};
  for(const e of G.edges){
    if(!vis(e.a)||!vis(e.b)||!edgeOn(e)) continue;
    const [want,k]=SPR[e.kind]||[130,.008];
    const dx=e.b.x-e.a.x, dy=e.b.y-e.a.y, d=Math.hypot(dx,dy)||1, f=(d-want)*k;
    e.a.vx+=f*dx/d; e.a.vy+=f*dy/d; e.b.vx-=f*dx/d; e.b.vy-=f*dy/d;
  }
  for(const n of live){
    if(n===drag) continue;
    n.vx+=(W/2-n.x)*0.00055; n.vy+=(H/2-n.y)*0.00055;  // 전역 중력은 숨만 쉬게
    // 자기 프로젝트 쪽 중력 — **power 에 비례**. 판정까지 간 가설이 많은 묶음만
    // 세게 당긴다. 보류만 쌓인 묶음은 느슨히 두는 편이 정직하다
    if(n.kind!=='project'&&n.projs&&n.projs.length){
      const p=byId['p_'+n.projs[0]];
      if(p){ const g=0.0008+0.0022*(p.power||0);
             n.vx+=(p.x-n.x)*g; n.vy+=(p.y-n.y)*g; }
    }
    // 속도는 **크기만** 자른다. 성분별로 자르면 대각선 쪽으로 방향이 꺾여
    // 전체가 천천히 도는 것처럼 보인다 (관측된 시계방향 흐름의 원인)
    const sp=Math.hypot(n.vx,n.vy);
    if(sp>4){ n.vx=n.vx/sp*4; n.vy=n.vy/sp*4; }
    n.x+=n.vx*cool; n.y+=n.vy*cool;
  }
  // 강체회전 성분을 통째로 뺀다 — 남은 소용돌이가 0 이 된다.
  // 회전은 물리가 아니라 사용자가 왼쪽 손잡이로 주는 것이다
  let cx=0, cy=0;
  for(const n of live){ cx+=n.x; cy+=n.y; }
  cx/=live.length||1; cy/=live.length||1;
  let L=0, I=0;
  for(const n of live){ const rx=n.x-cx, ry=n.y-cy;
    L+=rx*n.vy-ry*n.vx; I+=rx*rx+ry*ry; }
  if(I>1){ const w=L/I;
    for(const n of live){ const rx=n.x-cx, ry=n.y-cy;
      n.vx+=w*ry; n.vy-=w*rx; } }
}
const rad=n=>({project:9,data:7.5,column:5.5,metric:3.4})[n.kind]+Math.min(2,Math.sqrt(degree[n.id]||0)*0.55);
const fillOf=n=> n.kind==='project'?css('--text')

function draw(){

  const fs=focusSet();
  // 프로젝트 방울 — 구성원 convex hull 을 부풀려 반투명으로 깐다.
  // 색은 brand 한 가지(의미 색 아님) — 방울은 위치와 라벨로 갈린다
  for(const pn of G.nodes){
    if(!hull||pn.kind!=='project'||!vis(pn)||dimNode(pn)) continue;
    const mem=G.nodes.filter(n=>vis(n)&&n!==pn&&(n.projs||[]).includes(pn.projs[0]));
    if(mem.length<2) continue;
    const pts=mem.concat([pn]).map(n=>({x:n.x,y:n.y}));
    pts.sort((a,b)=>a.x-b.x||a.y-b.y);
    const cr=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
    const lo=[],hi=[];
    for(const p of pts){ while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop(); lo.push(p); }
    for(let i=pts.length-1;i>=0;i--){ const p=pts[i];
      while(hi.length>1&&cr(hi[hi.length-2],hi[hi.length-1],p)<=0)hi.pop(); hi.push(p); }
    const ring=lo.slice(0,-1).concat(hi.slice(0,-1));
    if(ring.length<3) continue;
    const cx=ring.reduce((a,p)=>a+p.x,0)/ring.length,
          cy=ring.reduce((a,p)=>a+p.y,0)/ring.length;
    const ex=ring.map(p=>{ const d=Math.hypot(p.x-cx,p.y-cy)||1;
      return {x:p.x+(p.x-cx)/d*24, y:p.y+(p.y-cy)/d*24}; });

      ctx.quadraticCurveTo(p.x,p.y,(p.x+q.x)/2,(p.y+q.y)/2); });
    ctx.closePath();

    ctx.globalAlpha=.16; ctx.strokeStyle=css('--brand'); ctx.lineWidth=1; ctx.stroke();

  for(const e of G.edges){
    if(!vis(e.a)||!vis(e.b)) continue;
    if(!edgeOn(e)) continue;          // 꺼진 열쇠의 선은 아예 안 그린다
    const sel=(pick&&pick.no!==undefined&&pick.no===e.no&&e.kind==='hyp')
              || e===hoverEdge;
    const on=sel||(fs&&fs.has(e.s)&&fs.has(e.t));
    ctx.beginPath(); ctx.moveTo(e.a.x,e.a.y); ctx.lineTo(e.b.x,e.b.y);
    ctx.strokeStyle = on ? css('--text')
      : e.kind==='claim' ? css('--brand') : css('--border-strong');
    ctx.lineWidth = e.kind==='hyp' ? (on?2.2:1.4)
                  : e.kind==='claim' ? (on?2.0:1.3) : (on?1.4:0.6);
    if(e.kind==='derives'){ ctx.setLineDash([3,3]); }
    if(e.kind==='claim') ctx.setLineDash([5,4]);
    ctx.globalAlpha = dimEdge(e)?0.05
      : (e.kind==='claim' ? (claimSel?0.95:0.5)
      : (on?0.95 : (fs?0.035 : (e.kind==='hyp'?0.4:0.13))));

  // 않도록 아이콘을 병행한다 (design-tokens: 의미 색은 판정 배지에만)
  const seenG=new Set();
  for(const e of G.edges){
    if(e.kind!=='hyp'||!edgeOn(e)||!vis(e.a)||!vis(e.b)||dimEdge(e)) continue;
    if(fs&&!(fs.has(e.s)&&fs.has(e.t))) continue;
    const key=e.no;
    if(seenG.has(key)) continue; seenG.add(key);
    const sx=sess[e.no]; if(!sx) continue;
    const mx=(e.a.x+e.b.x)/2, my=(e.a.y+e.b.y)/2;
    const rej=sx.rejected;
    const col=rej===true?css('--danger'):(rej===false?css('--ok'):css('--none'));
    const ic =rej===true?'\u2715':(rej===false?'\u2713':'?');
    ctx.globalAlpha=.95; ctx.fillStyle=css('--bg');
    ctx.beginPath(); ctx.arc(mx,my,6.5,0,6.284); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=1.3; ctx.stroke();
    ctx.fillStyle=col; ctx.font='bold 8px '+css('--font-sans');
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.save(); ctx.translate(mx,my); if(rot) ctx.rotate(-rot);

  }
  ctx.globalAlpha=1;
  if(claimSel){ const c=G.claims.find(x=>x.key===claimSel);
    if(c){ const parts=c.sessions.map(no=>{ const sx=sess[no];
        const t=sx.rejected===true?'\u2715 기각':(sx.rejected===false?'\u2713 유지':'? 보류');
        return no+' '+t; });
      ctx.save(); ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
      const txt=c.label+'  —  '+parts.join('   ');
      ctx.font='12.5px '+css('--font-sans'); ctx.textAlign='left';
      const w=ctx.measureText(txt).width;
      ctx.globalAlpha=.94; ctx.fillStyle=css('--bg-subtle');
      ctx.fillRect(10,10,w+22,26);
      ctx.strokeStyle=css('--border-strong'); ctx.lineWidth=1;
      ctx.strokeRect(10,10,w+22,26);
      ctx.globalAlpha=1; ctx.fillStyle=css('--text'); ctx.fillText(txt,21,27);
      ctx.restore(); } }
  for(const n of G.nodes){
    if(!vis(n)) continue;
    const dim=(fs&&!fs.has(n.id))||dimNode(n), r=rad(n);
    ctx.globalAlpha=dim?0.07:1; ctx.fillStyle=fillOf(n);
    // 옵시디언풍 — 본체보다 큰 반투명 헤일로가 방울 느낌을 만든다
    ctx.save(); ctx.globalAlpha=(dim?0.02:0.14);
    ctx.beginPath(); ctx.arc(n.x,n.y,r*2.2,0,6.284); ctx.fill(); ctx.restore();
    ctx.beginPath();
    if(n.kind==='data'){ ctx.roundRect(n.x-r,n.y-r,r*2,r*2,3); }
    else if(n.kind==='column'){ ctx.moveTo(n.x,n.y-r); ctx.lineTo(n.x+r,n.y);
      ctx.lineTo(n.x,n.y+r); ctx.lineTo(n.x-r,n.y); ctx.closePath(); }
    else { ctx.arc(n.x,n.y,r,0,6.284); }
    ctx.fill();
    if(n.kind==='project'){ ctx.globalAlpha=dim?0.12:0.85;
      ctx.strokeStyle=fillOf(n); ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.arc(n.x,n.y,rad(n)+3,0,6.283); ctx.stroke(); }
    if(n===pick||n===hover){ ctx.globalAlpha=1; ctx.strokeStyle=css('--text');
      ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(n.x,n.y,r+3.5,0,6.284); ctx.stroke(); }
    if(n===hover||n===pick||(fs&&fs.has(n.id))||n.kind==='project'||n.kind==='data'||view.k>1.25){
      ctx.globalAlpha=dim?0.12:1; ctx.fillStyle=css('--text');
      ctx.font='11px '+css('--font-sans'); ctx.textAlign='center';
      // 캔버스가 돌아도 글자는 선다 — 노드 자리로 옮겨 역회전한 뒤 쓴다
      ctx.save(); ctx.translate(n.x,n.y); if(rot) ctx.rotate(-rot);
      ctx.fillText(n.text,0,-r-6); ctx.restore();
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
}
let fitted=false;
function loop(){
  if(!fitted && cool<0.25){ fitAll(); fitted=true; }
  // 회전은 목표각으로 **미끄러져** 간다 — 슬라이더를 놓아도 관성처럼 따라붙는다
  const d=rotTarget-rot;
  if(Math.abs(d)>1e-4){ rot+=d*0.10; rotOut(); }
  else if(rot!==rotTarget){ rot=rotTarget; rotOut(); }
  step(); draw(); requestAnimationFrame(loop);
}

const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const unrot=p=>{ if(!rot) return p;
  const dx=p.x-W/2, dy=p.y-H/2, c=Math.cos(-rot), s2=Math.sin(-rot);
  return {x:W/2+dx*c-dy*s2, y:H/2+dx*s2+dy*c}; };
const pt=ev=>{const r=cv.getBoundingClientRect();
  return unrot({x:(ev.clientX-r.left-view.x)/view.k,
                y:(ev.clientY-r.top-view.y)/view.k});};
const hitNode=p=>G.nodes.find(n=>vis(n)&&Math.hypot(n.x-p.x,n.y-p.y)<=rad(n)+4)||null;
function hitEdge(p){ let best=null,bd=12/view.k;   // 화면 12px 기준
  for(const e of G.edges){ if(e.kind!=='hyp'||!vis(e.a)||!vis(e.b)) continue;
    const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,L=dx*dx+dy*dy||1;
    let t=((p.x-e.a.x)*dx+(p.y-e.a.y)*dy)/L; t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(p.x-(e.a.x+t*dx),p.y-(e.a.y+t*dy));
    if(d<bd){bd=d;best=e;} }
  return best; }

function hypLine(s){
  return '가설: ('+esc(s.q_name)+') '+esc(s.question);
}
function showNode(n){
  let h='<h2>'+esc(n.text)+'</h2>';
  if(n.kind==='metric'){
    h+='<span class="badge">'+esc(n.role)+'</span>';
    h+='<span class="badge '+n.fit+'">'+esc(n.fit_label)+'</span>';
    if(n.risks&&n.risks.length) h+='<p class="mono">'+esc(n.risks.join(' '))+'</p>';
    h+='<div class="k">의미 타입</div><p>'+esc(n.note)+'</p>';
    // 이 지표가 쓰인 가설과 그 판정. 지표를 눌렀을 때 이것이 안 나오면
    // 이어 둔 뜻이 없다 — 여러 가설이 한 지표를 공유하는 것이 요점이다
    const mine=G.sessions.filter(x=>['goal','support','guardrail']
      .some(r=>(x[r]||[]).includes(n.mname||n.text)));
    if(mine.length){
      h+='<div class="k">이 지표가 쓰인 가설 '+mine.length+'</div><div class="list">';
      mine.forEach(x=>{
        const t=x.rejected===true?['danger','\u2715 기각']
               :x.rejected===false?['ok','\u2713 유지']:['none','? 보류'];
        const role=['goal','support','guardrail'].find(r=>(x[r]||[]).includes(n.mname||n.text));
        h+='<button class="picke" data-no="'+x.no+'">'+esc(x.id)+' · '+role+'</button>'
          +'<span class="badge '+t[0]+'">'+t[1]+'</span>'; });
      h+='</div>';
      // 그중 같은 주장으로 묶인 것이 있으면 따로 모아 준다
      const cl={};
      mine.forEach(x=>(x.claims||[]).forEach(k=>{ (cl[k]=cl[k]||[]).push(x); }));
      for(const k in cl){
        const c=G.claims.find(y=>y.key===k); if(!c||cl[k].length<2) continue;
        h+='<div class="k">같은 주장 — '+esc(c.label)+'</div><div class="list">';
        cl[k].forEach(x=>{
          const t=x.rejected===true?['danger','\u2715']:x.rejected===false?['ok','\u2713']:['none','?'];
          h+='<button class="picke" data-no="'+x.no+'">'+esc(x.id)+'</button>'
            +'<span class="badge '+t[0]+'">'+t[1]+'</span>'; });
        h+='</div>';
      }
    }
    // 같은 이름의 지표가 다른 묶음에도 있다 — **같은 양이라는 보장은 없다.**
    // 그래서 선으로 잇지 않고 여기서만 건너가게 한다
    if(n.mname){
      const sib=G.nodes.filter(x=>x.kind==='metric'&&x.mname===n.mname&&x!==n);
      if(sib.length){
        h+='<div class="k">같은 이름 — 다른 묶음 '+sib.length+' (같은 양이 아닐 수 있음)</div><div class="list">';
        sib.forEach(x=>{ h+='<button class="pickn" data-id="'+x.id+'">'
          +esc((x.projs&&x.projs[0])||x.text)+'</button>'; });
        h+='</div>';
      }
    }
  } else if(n.kind==='data'){
    h+='<span class="badge">data</span>';
    h+='<div class="k">무엇인가</div><p>'+esc(n.note)+'</p>';
    h+='<div class="k">경로</div><p class="mono">'+esc(n.path)+'</p>';
  } else if(n.kind==='project'){
    h+='<span class="badge">project</span>';
    h+='<div class="k">무엇으로 묶었나</div><p>'+esc(n.note)+'</p>';
    if(n.n_sess) h+='<div class="k">판정까지 간 가설</div><p class="mono">'
      +n.n_done+' / '+n.n_sess+'  (power '+(n.power||0).toFixed(2)+')</p>';
    const mine=G.sessions.filter(x=>(x.projects||[]).includes(n.text));
    h+='<div class="k">세션 '+mine.length+'</div><div class="list">';
    mine.forEach(x=>{ h+='<button class="picke" data-no="'+x.no+'">'
      +x.no+' '+esc(x.stage)+'</button>'; });
    h+='</div>';
  } else {
    h+='<span class="badge">axis</span>';
    h+='<div class="k">무엇인가</div><p>'+esc(n.note)+'</p>';
    // 허브 축은 묶음마다 쪼개 두었다. 그래프에서는 안 이어져 있으므로
    // 여기서 건너갈 수 있게 한다 — 사람이 "같은 축"을 잃지 않도록
    if(n.axis){
      const sib=G.nodes.filter(x=>x.kind==='column'&&x.axis===n.axis&&x!==n);
      if(sib.length){
        h+='<div class="k">다른 묶음의 '+esc(n.axis)+' '+sib.length+'</div><div class="list">';
        sib.forEach(x=>{ h+='<button class="pickn" data-id="'+x.id+'">'
          +esc((x.projs&&x.projs[0])||x.text)+'</button>'; });
        h+='</div>';
      }
    }
  }
  // 이 노드에 달린 컬럼 — 데이터면 담고 있는 것, 지표면 파생된 출처
  const cols=[...new Set(G.edges.filter(e=>e.s===n.id&&e.kind==='holds')
                                .map(e=>e.t))].map(i=>byId[i]).filter(Boolean);
  if(cols.length){
    h+='<div class="k">컬럼 '+cols.length+'</div><div class="list">';
    cols.forEach(c=>{ h+='<button class="pickn" data-id="'+c.id+'">'
      +esc(c.text)+'</button>'; });
    h+='</div>';
  }
  // 이 노드가 걸린 가설 — 버튼으로 바로 간다
  const hs=n.kind==='project' ? []
    : [...new Set(G.edges.filter(e=>e.s===n.id||e.t===n.id).map(e=>e.no))].sort();
  if(hs.length){
    h+='<div class="k">가설 '+hs.length+'</div><div class="list">';
    hs.forEach(no=>{ const sx=sess[no];
      h+='<button class="picke" data-no="'+no+'">'+esc(sx.id)+' · '
        +esc(sx.q_name)+'</button>'; });
    h+='</div>';
  }
  side.innerHTML=h; wire();
}
function wire(){
  side.querySelectorAll('.pickn').forEach(b=>b.onclick=()=>{
    const n=byId[b.dataset.id]; if(!n) return;
    pick=n; hover=null; center(n); showNode(n); });
  side.querySelectorAll('.picke').forEach(b=>b.onclick=()=>{
    const e=G.edges.find(x=>x.no===b.dataset.no&&x.kind==='hyp')
          ||G.edges.find(x=>x.no===b.dataset.no);
    if(e){ pick=e; hover=null; showEdge(e); } });
}
function center(n){   // 고른 노드를 화면 가운데로 — 어디로 갔는지 찾게 하지 않는다
  view.x = W/2 - n.x*view.k; view.y = H/2 - n.y*view.k; cool=Math.max(cool,.4);
}
function showEdge(e){
  const s=sess[e.no];
  let h='<h2>'+esc(s.id)+'</h2>';
  h+='<span class="badge">'+esc(s.q)+' '+esc(s.q_name)+'</span>';
  const tri=s.rejected===true?['danger','기각']:(s.rejected===false?['ok','유지']:['none','보류']);
  h+='<span class="badge '+tri[0]+'">'+tri[1]+'</span>';
  if(s.stage) h+='<span class="badge">'+esc(s.stage)+'</span>';
  if((s.projects||[]).length)
    h+='<p class="mono" style="margin-top:6px">'+esc(s.projects.join(' · '))+'</p>';
  h+='<p style="margin-top:8px">'+hypLine(s)+'</p>';
  // 세 지표를 역할별로, **각각의 적합성 판정과 함께**. 하나라도 빠지면
  // "무엇을 올리려다 무엇이 깎이나" 가 안 보인다
  for(const role of ['goal','support','guardrail']){
    h+='<div class="k">'+role+'</div>';
    const names=s[role]||[];
    if(!names.length){ h+='<p class="mono">-</p>'; continue; }
    h+='<div class="list">';
    names.forEach(nm=>{
      const lead=(s.projects&&s.projects[0])||'';
      const m=byId['m_'+nm+'@'+lead]||byId['m_'+nm];
      const fit=m?('<span class="badge '+m.fit+'">'
                   +esc(m.fit_label.split(' ')[0])+'</span>'):'';
      h+='<button class="pickn" data-id="'+(m?m.id:'m_'+nm)+'">'+esc(nm)+'</button>'+fit;
    });
    h+='</div>';
  }
  h+='<div class="k">기각조건</div><p>'+esc(s.reject)+'</p>';
  h+='<div class="k">판정</div><p>'+esc(s.verdict)+'</p>';
  // 같은 주장 — 이 가설과 같은 것을 다른 데이터에서 검정한 세션들
  for(const ck of (s.claims||[])){
    const c=G.claims.find(x=>x.key===ck); if(!c) continue;
    h+='<div class="k">같은 주장 — '+esc(c.label)+'</div><div class="list">';
    c.sessions.forEach(no=>{ const sx=sess[no]; if(!sx) return;
      const v=sx.rejected===true?'danger':(sx.rejected===false?'ok':'none');
      const vt=sx.rejected===true?'기각':(sx.rejected===false?'유지':'보류');
      h+='<button class="picke" data-no="'+no+'">'+esc(sx.id)+'</button>'
        +'<span class="badge '+v+'">'+vt+'</span>'; });
    h+='</div>';
  }
  h+='<div class="k">이 선</div><div class="list">'
    +'<button class="pickn" data-id="'+e.s+'">'+esc(e.a.text)+'</button>'
    +'<button class="pickn" data-id="'+e.t+'">'+esc(e.b.text)+'</button></div>';
  side.innerHTML=h; wire();
}
cv.addEventListener('mousedown',ev=>{
  const p=pt(ev), n=hitNode(p);
  if(n){ drag=n; pick=n; showNode(n); return; }
  const e=hitEdge(p); if(e){ pick=e; showEdge(e); return; }
  pick=null; pan={x:ev.clientX-view.x,y:ev.clientY-view.y};
});
addEventListener('mousemove',ev=>{
  if(drag){ const p=pt(ev); drag.x=p.x; drag.y=p.y; drag.vx=drag.vy=0;
            cool=Math.max(cool,.5); }
  else if(pan){ view.x=ev.clientX-pan.x; view.y=ev.clientY-pan.y; }
  else { const p=pt(ev), h=hitNode(p);
    if(h!==hover){ hover=h; }
    hoverEdge = h ? null : hitEdge(p);
    cv.style.cursor = (h||hoverEdge) ? 'pointer' : 'grab'; }
});
addEventListener('mouseup',()=>{drag=null;pan=null;});
addEventListener('keydown',ev=>{ if(ev.key==='Escape')
  doReset(); });
cv.addEventListener('wheel',ev=>{ev.preventDefault();
  const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  const k=Math.max(.08,Math.min(4,view.k*(ev.deltaY<0?1.1:.9)));
  view.x=mx-(mx-view.x)*k/view.k; view.y=my-(my-view.y)*k/view.k; view.k=k;},
  {passive:false});
addEventListener('resize',size);
function rotOut(){ document.getElementById('rotv').textContent=
  Math.round(rot*180/Math.PI)+'\u00b0'; }
document.getElementById('rot').oninput=function(){
  rotTarget=(+this.value)*Math.PI/180; };   // 실제 각은 loop 가 따라간다
function auditLine(){

        + '지식 간선(hyp·claim·holds)만으로 세고 묶음 소속(owns)은 뺀다 — 소속까지 '

        + '개념(17.5%)은 안 센다 — 그 열쇠가 긋는 선 다섯 중 넷이 틀리므로 겹쳤다고 '
        + '이미 이어졌다 할 수 없다. 절반을 넘으면 선언이 자료를 되풀이하는 것이다',
        a.overfit_n)
    + (bad ? '<span class="warn">의심: '
        + a.rows.filter(r=>r.flag).map(r=>r.key).join(' \u00b7 ') + '</span>' : '')
    + '<span class="src">Source : OntoQA: Metric-Based Ontology Quality Analysis '
    + '(2005, Tartir et al.) \u2014 class richness \u00b7 cohesion'

}
document.getElementById('fit').onclick=()=>{ fitAll(); cool=Math.max(cool,.3); };
