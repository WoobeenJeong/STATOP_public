mb_specific_head: model-specific checks (MB-C28~C31, T0)
mb_specific_all_pass: no issues in the model-specific checks
mb_c28_not_applicable: '{family} is not subject to separation checks (coefficient-fitting families only)'
mb_c28_binary_only: the label is not binary, so separation was not checked
mb_c28_pass: no variable separates the label completely
mb_c28_found: '{n} variables almost completely separate the label - {cols}'
mb_c28_row: '{col}: {kind} (the two groups overlap over {overlap:.1%} of the range)'
mb_c28_complete: complete separation
mb_c28_quasi: quasi-complete separation
mb_c29_not_applicable: '{family} is not subject to collinearity checks (coefficient-fitting families only)'
mb_c29_pass: the largest VIF is {vmax:.1f} (reference threshold {limit})
mb_c29_found: some variables have a VIF of {limit} or above - {cols}
mb_c29_row: '{col}: VIF {vif:.1f}'
mb_c29_why: correlation between two or more variables means the estimates can move with the sample, and their effects are not separable - they cannot be interpreted independently (multicollinearity)
mb_c29_action: combine the overlapping variables or keep only one; if you keep both, do not interpret their coefficients individually
mb_c31_not_reported: no feature importance was reported, so this was not checked
mb_c31_pass: importance ({how}) reported - no variable pair correlates at {limit} or above
mb_c31_correlated: importance ({how}) reported - {n} variable pairs correlate strongly with each other
mb_c31_row: '{a} <-> {b}: |r| {r:.2f}'
mb_c27_noted: nondeterministic computation is disclosed - {note}
mb_c27_suspected: the environment mentions {found} but nondeterministic computation is not disclosed
mb_c27_why: GPU and parallel computation can give slightly different values per run even with a fixed seed
mb_c27_action: state the scope of reproducibility - exactly equal, or approximately equal
mb_c27_unknown: the environment record shows no trace of nondeterministic computation, so no judgement was made - this does not mean there is none
mb_seed_script_torch: if you use PyTorch
mb_c28_why_unpenalized: a single variable can separate the label completely, so the coefficient may diverge - its effect size and standard error cannot be trusted or interpreted
mb_c28_why_penalized: an L1/L2 penalty keeps the coefficient from diverging, but since one variable separates the label, its predictive contribution must be measured separately
mb_c28_action_unpenalized: check whether that variable is derived from the outcome; if not, consider Firth correction or penalized regression
mb_c28_action_penalized: check whether that variable is derived from the outcome, then measure its contribution by comparing predictive performance with and without it
mb_c29_rule_of_thumb: a VIF of {limit} is a rule of thumb, not an absolute threshold - read it together with the magnitude
mb_c31_why_impurity: when one of the pair is chosen first in a split, no contribution is left for the other, so the same information is spread across several variables - the ranking cannot be read at face value
mb_c31_why_permutation: shuffling one still leaves the same information in the correlated variable, so performance drops less - genuinely important variables can both score low
mb_c31_why_unknown: high correlation distorts importance - impurity-based measures split it, permutation-based measures push both down. Record which method was used
mb_c31_action_impurity: measure again with permutation importance, or group the overlapping variables before reading the ranking
mb_c31_action_permutation: use grouped permutation (shuffling correlated variables together), or read the ranking by group
mb_c31_action_unknown: record how the importance was computed - the distortion runs in a different direction for each method
mb_scope_note: STATOP only advises on direction before training - it does not judge what must be watched during training (early stopping, learning curves, optimization)
mb_scope_why: adjusting direction from values seen mid-training bends the choice toward the outcome, so the judgement follows the result rather than the data (bias)
