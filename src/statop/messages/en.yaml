metrics_custom_added: added to your recommendations — {name} ({role})
metrics_custom_removed: removed from your recommendations — {name}
metrics_custom_tag: user-defined
metrics_custom_need_name: type what to report alongside
metrics_custom_bad_role: role must be support or guardrail
metrics_custom_head: what you added — it will be suggested for this Goal again
metrics_custom_hint: anything can go here; the source stays marked as user-defined
screen_find_plot_btn: plot
screen_find_plot_head: '{x} x {y} — {n} rows'
screen_find_plot_groups: '{x} by group — {by}'
screen_find_plot_none: nothing to draw — pick two columns
screen_find_color_btn: colour by
screen_find_aim_btn: target power
screen_find_next: what to look at next
screen_find_power_what: columns {cols} · showing {name}
screen_find_power_one: one at a time - press [again] on another row to switch ({others})
screen_find_aim_prompt: target power %
screen_find_aim_bad: enter a number - e.g. 95
screen_find_color_set: 'colour by: {col}'
screen_find_color_off: no colour split
screen_find_color_none: no confirmed label column to colour by
explore_power_corr: with n={n} only |correlation| >= {r:.2f} is caught at 80% power — anything smaller is missed even if real
explore_power_tight: what you just measured sits near that edge — more samples could change the conclusion
explore_power_small: small sample (n={n})
power_head_corr: n={n} — only |correlation| {r:.2f} or larger is caught {pw}% of the time
power_head_diff: n={n} — only effect size d {d:.2f} or larger is caught {pw}% of the time
power_band: hard to catch with this sample
power_why: in a small sample "not significant" is not "no relation" — it may be real and missed
power_row_ok: large enough to be caught
power_row_short: a size like this needs about n={need} to be caught {pw}% of the time (now {n})
power_row_edge: right at the edge — a slightly different sample could flip the conclusion
power_need_huge: catching a size like this would need a very large sample
power_ladder_head: if you collect more — smallest size caught at each n
power_note_alpha: alpha=0.05 two-sided · target power {pw}%
power_target_label: target power
power_target_hint: move the line — the surer you want to be, the larger the size you need
power_not_comparable: '{eff} is on a different scale from a correlation — not compared against this line'
power_scale_note: the line is on the correlation (r, rho) scale; values on other scales (tau, dCor) are not placed on it
power_this_value: this value
