mb_c22_values: '{n} folds - mean {mean:.3f}, SD {sd:.3f}, worst fold {worst:.3f}'
mb_c22_pass: fold-to-fold spread {sd:.3f}, within the threshold of {limit}
mb_c22_wide: the fold-to-fold spread is {sd:.3f} - the mean is {mean:.3f} but the worst fold is {worst:.3f}
mb_c22_why: reporting the mean alone hides which fold fell apart
mb_c22_action: report the spread and the worst fold alongside the mean
mb_c23_no_test: no test set, so this was not checked
mb_c23_pass: the configuration was revised only once against this test set
mb_c23_repeated: the configuration was revised {n} times against the same test set
mb_c23_why: repeatedly adjusting settings after seeing the result turns the test set into a validation set, and the reported performance becomes optimistic
mb_c23_limit: this counts only the configurations recorded in the session - runs outside it cannot be seen
mb_c23_action: set aside a hold-out for the final report and do the tuning on a validation set
