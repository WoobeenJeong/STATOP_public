mb_repro_all_pass: no issues with metric changes or reproducibility
mb_c21_no_metric: the reported metric is not recorded, so changes were not checked
mb_c21_same: the reported metric has stayed {metric}
mb_c21_changed: the reported metric changed from {old} to {new} with no reason recorded
mb_c21_why: the metrics differ, so the two cannot be compared on equal terms
mb_c21_change_action: record why it changed and report the earlier metric alongside
mb_c21_reason_given: the reported metric changed from {old} to {new} and a reason is recorded
mb_c21_reason: reason - {reason}
