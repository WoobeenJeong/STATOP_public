mb_triad_all_pass: no issues with the metric setup
mb_c24_no_triad: no triad row in the rule table matches {q} - nothing is invented
mb_c24_goal: Goal
mb_c24_support: Support
mb_c24_guardrail: Guardrail
mb_c24_row: '{role} - {what}'
mb_c24_basis: max:min class ratio {ratio:.1f}x (threshold {limit}) - the "{which}" row was chosen
mb_c24_not_recorded: no reported metric is recorded - here is the 3-metric set for "{q}"
