a3_cause_skew: skewed - transform (e.g. log) or go nonparametric
a3_cause_shape: distribution shape itself (bimodal/tails) - nonparametric recommended
a3_cause_mixed_shapes: causes differ across groups - shapes differ, rank-based tests recommended
a3_var_ok: no evidence of unequal variance (Brown-Forsythe p={p:.3f})
a3_var_violated: variances differ - SD ratio {ratio:.1f}x (p={p:.2e}). Use Welch-type tests
a3_vif_ok: max VIF {vmax:.1f} - no collinearity problem
