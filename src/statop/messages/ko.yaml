mb_c31_why_impurity: 분할에서 둘 중 하나가 먼저 뽑히면 나머지에는 기여가 남지 않아, 같은 정보가 여러 변수로 나뉘어 실립니다 — 순위를 그대로 읽기 어렵습니다
mb_c31_why_permutation: 한쪽을 섞어도 상관된 다른 변수에 같은 정보가 남아 성능이 덜 떨어집니다 — 실제로는 중요한 변수가 둘 다 낮게 나올 수 있습니다
mb_c31_why_unknown: 상관이 높으면 중요도가 어긋납니다 — impurity 계열은 나뉘어 실리고, permutation 계열은 둘 다 낮게 나옵니다. 어느 방식인지 구성에 적어 주십시오
mb_c31_action_impurity: permutation importance 로 다시 재거나, 겹치는 변수를 묶은 뒤 순위를 보십시오
mb_c31_action_permutation: 상관된 변수를 묶어 한꺼번에 섞는 방식(grouped permutation)으로 재거나, 묶은 단위로 순위를 보십시오
mb_c31_action_unknown: 중요도를 어떤 방식으로 구했는지 구성에 적어 주십시오 — 방식마다 어긋나는 방향이 다릅니다
